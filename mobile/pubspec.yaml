name: rafiki_mobile_app
description: "Rafiki Companion Robot Mobile Application - Act as Rafiki's Mouth (TTS) and Ears (STT), synced with Raspberry Pi and FastAPI backend."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_tts: ^3.8.5
  speech_to_text: ^7.4.0
  web_socket_channel: ^3.0.3
  http: ^1.2.0
  provider: ^6.1.1
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
